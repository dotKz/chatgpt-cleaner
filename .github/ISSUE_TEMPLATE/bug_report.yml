name: Bug report
description: Report something that is not working correctly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never include access tokens, cookies or private conversation content.
  - type: input
    id: version
    attributes:
      label: ChatGPT Cleaner version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 154"
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Userscript manager and version
      placeholder: "Tampermonkey ..."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ChatGPT Cleaner
        2. ...
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste only relevant errors. Remove private data first.
      render: shell
    validations:
      required: false
